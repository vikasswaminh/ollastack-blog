name: CI Email Smoke
on: [push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci
      - name: Create ephemeral inbox
        id: inbox
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.OLLASTACK_KEY }}" -H "Content-Type: application/json" \
            -d '{"ttl":"30m"}' https://api.ollastack.com/inboxes | jq -r '.address' > inbox.txt
      - name: Run Playwright tests
        env:
          OLLASTACK_INBOX: ${{ steps.inbox.outputs.address }}
          OLLASTACK_KEY: ${{ secrets.OLLASTACK_KEY }}
        run: npx playwright test --grep @email
