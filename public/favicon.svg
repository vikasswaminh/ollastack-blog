<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 48" fill="none" role="img" aria-label="Ollastack">
  <defs>
    <!-- Crisp 3D Shading Gradients -->
    <linearGradient id="topRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="midRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="botBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(-7, 0.5)">
    <!-- ================= LAYER 3: BOTTOM LAYER (OBSIDIAN WITH CRISP WHITE/SILVER SEPARATOR) ================= -->
    <!-- Bottom Rim Extrusion with clear light border so it is visible on DARK browser tabs -->
    <path d="M 8.5 28.5 L 8.5 34.5 C 8.5 36.5, 10 38, 12 39.2 L 24 45.8 C 25.5 46.6, 27.5 46.6, 29 45.8 L 41 39.2 C 43 38, 44.5 36.5, 44.5 34.5 L 44.5 28.5 C 44.5 30.5, 43 32, 41 33.2 L 29 39.8 C 27.5 40.6, 25.5 40.6, 24 39.8 L 12 33.2 C 10 32, 8.5 30.5, 8.5 28.5 Z" 
          fill="url(#botBlack)" stroke="#A1A1AA" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- Top Face of Bottom Layer -->
    <path d="M 24 37 C 22.5 36.2, 11 30.5, 9.5 29.5 C 8 28.5, 8 26.5, 9.5 25.5 C 11 24.5, 22.5 18.8, 24 18 C 25.5 17.2, 27.5 17.2, 29 18 C 30.5 18.8, 42 24.5, 43.5 25.5 C 45 26.5, 45 28.5, 43.5 29.5 C 42 30.5, 30.5 36.2, 29 37 C 27.5 37.8, 25.5 37.8, 24 37 Z" 
          fill="#18181B" stroke="#E4E4E7" stroke-width="0.8"/>

    <!-- ================= LAYER 2: MIDDLE LAYER (CRIMSON RED) ================= -->
    <!-- Middle Rim Extrusion -->
    <path d="M 8.5 17 L 8.5 23 C 8.5 25, 10 26.5, 12 27.7 L 24 34.3 C 25.5 35.1, 27.5 35.1, 29 34.3 L 41 27.7 C 43 26.5, 44.5 25, 44.5 23 L 44.5 17 C 44.5 19, 43 20.5, 41 21.7 L 29 28.3 C 27.5 29.1, 25.5 29.1, 24 28.3 L 12 21.7 C 10 20.5, 8.5 19, 8.5 17 Z" 
          fill="url(#midRed)" stroke="#DC2626" stroke-width="0.6" stroke-linejoin="round"/>
    <!-- Top Face of Middle Layer -->
    <path d="M 24 25.5 C 22.5 24.7, 11 19, 9.5 18 C 8 17, 8 15, 9.5 14 C 11 13, 22.5 7.3, 24 6.5 C 25.5 5.7, 27.5 5.7, 29 6.5 C 30.5 7.3, 42 13, 43.5 14 C 45 15, 45 17, 43.5 18 C 42 19, 30.5 24.7, 29 25.5 C 27.5 26.3, 25.5 26.3, 24 25.5 Z" 
          fill="#B91C1C" stroke="#F87171" stroke-width="0.5"/>

    <!-- ================= LAYER 1: TOP LAYER (VIBRANT BRAND RED WITH CRISP WHITE HOLE) ================= -->
    <!-- Top Rim Extrusion -->
    <path d="M 8.5 12.5 L 8.5 17.5 C 8.5 19.5, 10 21, 12 22.2 L 24 28.8 C 25.5 29.6, 27.5 29.6, 29 28.8 L 41 22.2 C 43 21, 44.5 19.5, 44.5 17.5 L 44.5 12.5 C 44.5 14.5, 43 16, 41 17.2 L 29 23.8 C 27.5 24.6, 25.5 24.6, 24 23.8 L 12 17.2 C 10 16, 8.5 14.5, 8.5 12.5 Z" 
          fill="#DC2626" stroke="#EF4444" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- Outer Top Face -->
    <path d="M 24 14 C 22.5 13.2, 11 7.5, 9.5 6.5 C 8 5.5, 8 3.5, 9.5 2.5 C 11 1.5, 22.5 -4.2, 24 -5 C 25.5 -5.8, 27.5 -5.8, 29 -5 C 30.5 -4.2, 42 1.5, 43.5 2.5 C 45 3.5, 45 5.5, 43.5 6.5 C 42 7.5, 30.5 13.2, 29 14 C 27.5 14.8, 25.5 14.8, 24 14 Z" 
          fill="url(#topRed)" transform="translate(0, 7)"/>
    <!-- Center Cutout Opening (Pure Bold White with subtle inner depth) -->
    <path d="M 24 16 C 23.2 15.6, 17 12.5, 16 12 C 15.2 11.5, 15.2 10.5, 16 10 C 17 9.5, 23.2 6.4, 24 6 C 24.8 5.6, 25.8 5.6, 26.6 6 C 27.4 6.4, 33.6 9.5, 34.6 10 C 35.4 10.5, 35.4 11.5, 34.6 12 C 33.6 12.5, 27.4 15.6, 26.6 16 C 25.8 16.4, 24.8 16.4, 24 16 Z" 
          fill="#FFFFFF" stroke="#FEE2E2" stroke-width="0.5"/>
  </g>
</svg>